
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSP SENSITIVITY AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080914;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
header{text-align:center;padding:22px 0}
.logo{font-size:27px;font-weight:900;color:#a78bfa}
.sub{color:#aaa;font-size:12px;letter-spacing:2px}
.card{
 background:#151629;border:1px solid #34334f;
 border-radius:16px;padding:18px;margin:15px 0;
}
h2{color:#c4b5fd;font-size:19px}
label{display:block;margin-top:15px;color:#ddd}
input,select{
 width:100%;padding:13px;margin-top:7px;
 border:1px solid #45435f;border-radius:9px;
 background:#25253a;color:white;font-size:15px;
}
button{
 width:100%;padding:15px;margin-top:18px;
 border:0;border-radius:10px;
 background:linear-gradient(90deg,#7439df,#a855f7);
 color:white;font-weight:bold;font-size:16px;
}
.result{display:none}
.value{
 display:flex;justify-content:space-between;
 padding:12px;border-bottom:1px solid #34334f;
}
.value strong{color:#c4b5fd}
footer{text-align:center;color:#888;font-size:11px;margin:25px 0}
</style>
</head>
<body>

<header>
 <div class="logo">GSP SENSITIVITY AI</div>
 <p class="sub">YOUR DEVICE. YOUR GAME.</p>
</header>

<div class="card">
 <h2>📱 Phone Details</h2>

 <label>Mobile Model</label>
 <input id="phone" placeholder="Example: POCO M7 5G">

 <label>RAM</label>
 <select id="ram">
  <option value="4">4 GB</option>
  <option value="6" selected>6 GB</option>
  <option value="8">8 GB</option>
  <option value="12">12 GB</option>
  <option value="16">16 GB</option>
 </select>

 <label>Refresh Rate</label>
 <select id="refresh">
  <option value="60">60 Hz</option>
  <option value="90">90 Hz</option>
  <option value="120">120 Hz</option>
  <option value="144">144 Hz</option>
 </select>

 <label>Gyroscope</label>
 <select id="gyro">
  <option value="off">OFF</option>
  <option value="on">ON</option>
 </select>

 <label>Playing Fingers</label>
 <select id="fingers">
  <option value="2">2 Fingers</option>
  <option value="3">3 Fingers</option>
  <option value="4">4 Fingers</option>
 </select>

 <label>Playing Style</label>
 <select id="style">
  <option value="headshot">Headshot</option>
  <option value="balanced">Balanced</option>
  <option value="rush">Rusher</option>
 </select>

 <button onclick="generate()">GENERATE SENSITIVITY</button>
</div>

<div class="card result" id="result">
 <h2>🔥 Your Sensitivity</h2>
 <p id="device"></p>
 <div id="values"></div>
 <button onclick="copyResult()">COPY SENSITIVITY</button>
 <p style="color:#aaa;font-size:12px">
  These are starting suggestions. Adjust them in-game
  according to your comfort and test results.
 </p>
</div>

<script>
function generate(){
 const phone=document.getElementById("phone").value.trim();
 if(!phone){
  alert("Please enter your mobile model!");
  return;
 }

 const ram=Number(document.getElementById("ram").value);
 const hz=Number(document.getElementById("refresh").value);
 const gyro=document.getElementById("gyro").value;
 const fingers=Number(document.getElementById("fingers").value);
 const style=document.getElementById("style").value;

 let base=170;
 if(hz>=120) base+=8;
 else if(hz>=90) base+=4;
 if(ram>=8) base+=3;
 if(fingers>=4) base+=3;
 if(gyro==="on") base-=5;

 if(style==="headshot") base+=10;
 if(style==="rush") base+=5;

 function limit(n){
  return Math.max(0,Math.min(200,n));
 }

 const settings=[
  ["General",limit(base)],
  ["Red Dot",limit(base-5)],
  ["2X Scope",limit(base-15)],
  ["4X Scope",limit(base-30)],
  ["Sniper Scope",limit(base-65)],
  ["Free Look",limit(base-10)]
 ];

 document.getElementById("device").textContent=
  "Device: "+phone+" | "+ram+"GB RAM | "+hz+"Hz";

 document.getElementById("values").innerHTML=
  settings.map(([name,value])=>
   `<div class="value"><span>${name}</span><strong>${value}</strong></div>`
  ).join("");

 document.getElementById("result").style.display="block";
}

function copyResult(){
 const text=document.getElementById("device").textContent+
 "\n"+Array.from(document.querySelectorAll("#values .value"))
 .map(x=>x.innerText).join("\n");
 if(navigator.clipboard && window.isSecureContext){
  navigator.clipboard.writeText(text)
   .then(()=>alert("Sensitivity Copied!"))
   .catch(()=>alert("Please select and copy the result."));
 }else{
  alert("Please select and copy the result manually.");
 }
}
</script>

<footer>
 GSP SENSITIVITY AI © 2026<br>
 Fan-made tool. Not affiliated with Garena.
</footer>

</body>
  </html>
